steps:
  # Build do contêiner Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/comexport-reconciliation:$COMMIT_SHA', '-f', 'backend/Dockerfile', '.']

  # Push para o Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/comexport-reconciliation:$COMMIT_SHA']

  # Deploy automático no Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'comexport-reconciliation'
      - '--image'
      - 'gcr.io/$PROJECT_ID/comexport-reconciliation:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GEMINI_MODEL=gemini-3.8-flash'

images:
  - 'gcr.io/$PROJECT_ID/comexport-reconciliation:$COMMIT_SHA'
